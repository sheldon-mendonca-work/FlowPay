name: "flowpay-infra"

services:

  # ----------------------------
  # 🐘 PostgreSQL
  # ----------------------------
  postgres:
    image: postgres:15
    # container_name: flowpay-postgres
    restart: unless-stopped
    env_file:
      - ./env/postgres.env
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------
  # 🔴 Redis
  # ----------------------------
  redis:
    image: redis:7
    # container_name: flowpay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  # ----------------------------
  # 📨 Kafka
  # ----------------------------
  kafka:
    image: apache/kafka:4.3.1
    # container_name: flowpay-kafka
    restart: unless-stopped

    env_file:
      - ./env/kafka.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

    ports:
      - "9092:9092"
      - "9094:9094"

    volumes:
      - kafka_data:/var/lib/kafka/data
  
      
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_started

    volumes:
      - ./kafka/topics.yaml:/config/topics.yaml

    entrypoint:
      - /bin/sh
      - -ec
      - |
        echo "Waiting for Kafka..."

        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --list >/dev/null 2>&1
        do
          sleep 2
        done

        echo "Kafka is ready"

        topic_name=""
        partitions=""

        while IFS= read -r line; do
          case "$$line" in
            *"- name:"*)
              topic_name=$$(echo "$$line" | awk -F': ' '{print $$2}')
              ;;
            *"partitions:"*)
              partitions=$$(echo "$$line" | awk -F': ' '{print $$2}')

              if [ -n "$$topic_name" ] && [ -n "$$partitions" ]; then
                echo "Creating topic: $$topic_name"

                /opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server kafka:9092 \
                  --create \
                  --if-not-exists \
                  --topic "$$topic_name" \
                  --partitions "$$partitions" \
                  --replication-factor 1
              fi
              ;;
          esac
        done < /config/topics.yaml

        echo "Topics ready"
  # ----------------------------
  # 📊 Prometheus
  # ----------------------------
  prometheus:
    image: prom/prometheus:v3.13.1
    # container_name: flowpay-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - postgres

 
volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
