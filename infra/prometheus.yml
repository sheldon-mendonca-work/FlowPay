global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "flowpay-services"
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8001
  - job_name: "flowpay-reconciliation"
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8004
  - job_name: "flowpay-offer-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8005
